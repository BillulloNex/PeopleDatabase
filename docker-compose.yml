version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgres_secure_pass@db:5432/peopledatabase
      - MEILISEARCH_HOST=http://search:7700
      - MEILISEARCH_KEY=meili_secure_key_123
      - REDIS_URL=redis://redis:6379
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - EXA_API_KEY=${EXA_API_KEY}
      - INGESTION_WEBHOOK_SECRET=${INGESTION_WEBHOOK_SECRET}
    depends_on:
      - db
      - search
      - redis
    restart: always

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_DB: peopledatabase
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  search:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: meili_secure_key_123
    volumes:
      - meilidata:/meili_data
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: always

volumes:
  pgdata:
  meilidata:
  redisdata:
