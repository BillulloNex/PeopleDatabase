name: 🚀 High-Throughput Scale & Stress Test Engine

on:
  # schedule:
  #   - cron: '*/15 * * * *' # Run every 15 minutes around the clock (Temporarily disabled)
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Exa profiles per matrix topic'
        required: false
        default: '15'

jobs:
  matrix-stress-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topic:
          - 'founders of AI startups in SF'
          - 'senior rust systems engineers'
          - 'VP of marketing SaaS founders'
          - 'cybersecurity security engineers'
          - 'venture capital partner investors'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Scaled Ingestion Matrix Job
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run worker:exa -- "${{ matrix.topic }}"
