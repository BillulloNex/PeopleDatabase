name: Scheduled Exa.ai Discovery Ingestion

on:
  # schedule:
  #   - cron: '0 */6 * * *' # Run every 6 hours (Temporarily disabled)
  workflow_dispatch:
    inputs:
      query:
        description: 'Exa Neural Search Query'
        required: false
        default: 'founders of tech startups in SF'

jobs:
  exa-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Exa Neural Discovery Worker
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run worker:exa -- "${{ github.event.inputs.query || 'founders of tech startups' }}"
