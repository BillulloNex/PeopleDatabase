name: 🌐 Multi-Engine Discovery Crawler

on:
  schedule:
    - cron: '*/12 * * * *'  # Every 12 minutes, 24/7 (5 runs/hr)
  workflow_dispatch:

jobs:
  # ============================================================
  # ENGINE 1: GitHub API (FREE — no key needed)
  # ============================================================
  github-discovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        query_index: [0, 7, 14, 21, 28]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: 🐙 GitHub Discovery (Query ${{ matrix.query_index }})
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run worker:github -- "${{ matrix.query_index }}" "10"

  # ============================================================
  # ENGINE 2: Wikidata SPARQL (FREE — zero LLM cost)
  # ============================================================
  wikidata-discovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        occupation_index: [0, 4, 8, 12, 16]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: 📚 Wikidata Discovery (Occupation ${{ matrix.occupation_index }})
        run: npm run worker:wikidata -- "${{ matrix.occupation_index }}" "25"

  # ============================================================
  # ENGINE 3: arXiv (FREE — zero LLM cost)
  # ============================================================
  arxiv-discovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        category_index: [0, 4, 8, 12, 16]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: 📄 arXiv Discovery (Category ${{ matrix.category_index }})
        run: npm run worker:arxiv -- "${{ matrix.category_index }}" "30"

  # ============================================================
  # ENGINE 4: ORCID (FREE — zero LLM cost)
  # ============================================================
  orcid-discovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        query_index: [0, 6, 12, 18, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: 🔬 ORCID Discovery (Keyword ${{ matrix.query_index }})
        run: npm run worker:orcid -- "${{ matrix.query_index }}" "15"
