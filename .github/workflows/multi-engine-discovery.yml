name: 🌐 Multi-Engine Discovery Crawler

on:
  # schedule:
  #   - cron: '*/12 * * * *'  # Every 12 minutes, 24/7 (Temporarily disabled)
  workflow_dispatch:

jobs:
  # ============================================================
  # ENGINE 1: GitHub API (FREE)
  # ============================================================
  github-discovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        query_index: [0, 7, 14, 21, 28]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: 🐙 GitHub Discovery (Query ${{ matrix.query_index }})
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run worker:github -- "${{ matrix.query_index }}" "10"

  # ============================================================
  # ENGINE 2: Wikidata SPARQL (FREE)
  # ============================================================
  wikidata-discovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        occupation_index: [0, 4, 8, 12, 16]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: 📚 Wikidata Discovery (Occupation ${{ matrix.occupation_index }})
        run: npm run worker:wikidata -- "${{ matrix.occupation_index }}" "25"

  # ============================================================
  # ENGINE 3: arXiv (FREE)
  # ============================================================
  arxiv-discovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        category_index: [0, 4, 8, 12, 16]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: 📄 arXiv Discovery (Category ${{ matrix.category_index }})
        run: npm run worker:arxiv -- "${{ matrix.category_index }}" "30"

  # ============================================================
  # ENGINE 4: ORCID (FREE)
  # ============================================================
  orcid-discovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        query_index: [0, 6, 12, 18, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: 🔬 ORCID Discovery (Keyword ${{ matrix.query_index }})
        run: npm run worker:orcid -- "${{ matrix.query_index }}" "15"

  # ============================================================
  # ENGINE 5: NPI Registry — US Healthcare Providers (FREE, 7M+)
  # ============================================================
  npi-discovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        specialty_index: [0, 3, 6, 9, 12, 15, 18, 21, 24, 27]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: 🏥 NPI Discovery (Specialty ${{ matrix.specialty_index }})
        run: npm run worker:npi -- "${{ matrix.specialty_index }}" "50"

  # ============================================================
  # ENGINE 6: OpenAlex — 250M+ Academic Works (FREE)
  # ============================================================
  openalex-discovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        concept_index: [0, 5, 10, 15, 20, 25, 30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: 🎓 OpenAlex Discovery (Concept ${{ matrix.concept_index }})
        run: npm run worker:openalex -- "${{ matrix.concept_index }}" "100"

  # ============================================================
  # ENGINE 7: Semantic Scholar (FREE)
  # ============================================================
  semantic-scholar-discovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topic_index: [0, 5, 10, 15, 20, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: 🔎 Semantic Scholar Discovery (Topic ${{ matrix.topic_index }})
        run: npm run worker:s2 -- "${{ matrix.topic_index }}" "100"

  # ============================================================
  # ENGINE 8: PubMed — Biomedical Research (FREE)
  # ============================================================
  pubmed-discovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topic_index: [0, 3, 6, 9, 12, 15, 18, 21, 24, 27]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: 🧬 PubMed Discovery (Topic ${{ matrix.topic_index }})
        run: npm run worker:pubmed -- "${{ matrix.topic_index }}" "50"
