name: 💾 Hourly Database Backup

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backups
          fetch-depth: 1
        continue-on-error: true

      - name: 🔧 Initialize backups branch if needed
        run: |
          if [ ! -d ".git" ]; then
            git init
            git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
            git checkout -b backups
          fi

      - name: 📥 Export all profiles from production
        run: |
          mkdir -p snapshots
          
          curl -sf 'http://people.beenex.org/api/search?limit=50000' \
            -o snapshots/profiles_latest.json || echo '{"total":0,"data":[]}' > snapshots/profiles_latest.json
          
          TOTAL=$(python3 -c "import json; d=json.load(open('snapshots/profiles_latest.json')); print(d.get('total',0))")
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV
          echo "Exported $TOTAL profiles"

      - name: 📤 Commit backup
        run: |
          git config user.name "PeopleDB Backup Bot"
          git config user.email "backup@peopledatabase.beenex.org"
          
          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          
          # Keep a timestamped copy
          cp snapshots/profiles_latest.json "snapshots/profiles_${TIMESTAMP}.json"
          
          # Purge old snapshots (keep last 48)
          ls -t snapshots/profiles_2*.json 2>/dev/null | tail -n +49 | xargs rm -f 2>/dev/null || true
          
          # Summary
          python3 -c "
          import json
          data = json.load(open('snapshots/profiles_latest.json'))
          total = data.get('total', 0)
          profiles = data.get('data', [])
          with open('README.md', 'w') as f:
              f.write('# PeopleDatabase Backups (auto-generated)\n\n')
              f.write(f'**Total Profiles**: {total}\n')
              f.write(f'**Last Backup**: $TIMESTAMP\n\n')
              f.write('| Name | Title | Company | Source |\n|------|-------|---------|--------|\n')
              for p in profiles[:30]:
                  name = p.get('fullName','').replace('|','-')
                  title = p.get('currentTitle','').replace('|','-')
                  company = p.get('currentCompany','').replace('|','-')
                  src = (p.get('sources', [{}])[0] or {}).get('domain', '')
                  f.write(f'| {name} | {title} | {company} | {src} |\n')
          "
          
          git add .
          git diff --cached --quiet || git commit -m "backup: ${TOTAL} profiles @ ${TIMESTAMP}"
          git push origin backups || (git push --set-upstream origin backups)
