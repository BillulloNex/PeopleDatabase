name: 💾 Hourly Database Backup

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Export all profiles from production
        run: |
          mkdir -p snapshots
          curl -sf 'http://people.beenex.org/api/search?limit=50000' \
            -o snapshots/profiles_latest.json || echo '{"total":0,"data":[]}' > snapshots/profiles_latest.json
          
          TOTAL=$(python3 -c "import json; d=json.load(open('snapshots/profiles_latest.json')); print(d.get('total',0))")
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV
          echo "Exported $TOTAL profiles"

      - name: 📤 Push backup to backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN || github.token }}
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          
          # Clone backup repo (shallow)
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/BillulloNex/PeopleDatabase-backups.git /tmp/repo || true
          cd /tmp/repo
          
          git config user.name "PeopleDB Backup Bot"
          git config user.email "backup@peopledatabase.beenex.org"
          
          # Clean existing files (except git metadata)
          git rm -rf . 2>/dev/null || true
          mkdir -p snapshots
          
          cp $GITHUB_WORKSPACE/snapshots/profiles_latest.json snapshots/profiles_latest.json
          cp $GITHUB_WORKSPACE/snapshots/profiles_latest.json "snapshots/profiles_${TIMESTAMP}.json"
          
          # Summary readme
          python3 -c "
          import json
          data = json.load(open('snapshots/profiles_latest.json'))
          total = data.get('total', 0)
          profiles = data.get('data', [])
          with open('README.md', 'w') as f:
              f.write('# PeopleDatabase Backups (auto-generated)\n\n')
              f.write(f'**Total Profiles**: {total}\n\n')
              f.write(f'**Last Backup Timestamp**: {TIMESTAMP}\n\n')
              f.write('| Name | Title | Company | Source |\n|------|-------|---------|--------|\n')
              for p in profiles[:30]:
                  name = str(p.get('fullName','')).replace('|','-')
                  title = str(p.get('currentTitle','')).replace('|','-')
                  company = str(p.get('currentCompany','')).replace('|','-')
                  src = (p.get('sources', [{}])[0] or {}).get('domain', '') if isinstance(p.get('sources'), list) and len(p.get('sources')) > 0 else ''
                  f.write(f'| {name} | {title} | {company} | {src} |\n')
          "
          
          git add -A
          git commit -m "backup: ${TOTAL} profiles @ ${TIMESTAMP}" || echo "Nothing to commit"
          git push origin main --force

